[project]
name = "packager"
version = "0.1.0"
description = "Per-item shaka-packager worker for katalog. Terminal stage of the pipeline: consumes the Kafka topic stube.catalog.item.transcoded, packages the transcoder's video renditions (renditions.json), stereo + 5.1 audio and WebVTT subtitles with ffmpeg + shaka-packager into one CMAF/HLS tree under /var/lib/katalog/packages, and reports package=done/failed back. Runs in its own pod so a packager crash doesn't take down the analyzer."
requires-python = ">=3.11"
dependencies = [
  # HTTP client to katalog API (get_item, get_steps, upsert_step,
  # packaging_complete). Sync because the worker processes one item at a
  # time and packaging dominates the latency anyway.
  "httpx==0.28.1",
  # Kafka consumer. The manylinux wheel bundles librdkafka, so no
  # apt/Dockerfile change is needed on a glibc base.
  "confluent-kafka==2.5.3",
  # Structured JSON logs.
  "structlog==25.4.0",
  # Tiny FastAPI surface for /healthz + /readyz. uvicorn runs it side-car to
  # the worker loop in the same process so kubelet probes work.
  "fastapi==0.118.0",
  "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.7.0",
  "pytest==8.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored byte for byte from the schemas repository (tests/test_libv2_records.py).
extend-exclude = ["src/packager/libv2_records.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
