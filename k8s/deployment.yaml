apiVersion: apps/v1
kind: Deployment
metadata:
  name: packager
  namespace: stube
  labels:
    app: packager
    value-stream: stube
    component: pipeline
    plane: worker
spec:
  # 2 replicas. Packaging is CPU-bound and serial inside a pod. The
  # worker is a Kafka consumer in group `packager-workers`, so Kafka
  # rebalances the `stube.catalog.item.transcoded` partitions across
  # the replicas — this scales linearly up to the topic's partition
  # count. When the queue is idle the pods block on a 1 s poll with no
  # HTTP traffic to katalog-manager-api at all.
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: packager
  template:
    metadata:
      labels:
        app: packager
        value-stream: stube
        component: pipeline
        plane: worker
    spec:
      serviceAccountName: packager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: zaentrum/packager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KATALOG_API_URL
              # Workers point at the manager API for reads + writes
              # (get_item, get_steps, upsert_step, packaging_complete).
              # Service URL with no /api suffix; the client prepends
              # "/api/...".
              value: "http://katalog-manager-api.stube.svc.cluster.local"
            - name: OIDC_TOKEN_URL
              # Your identity provider's OAuth2 token endpoint.
              value: "https://sso.example.com/realms/your-realm/protocol/openid-connect/token"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: katalog-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: katalog-oidc
                  key: client-secret
            # Kafka. PLAINTEXT bootstrap broker(s); the packager consumes
            # `stube.catalog.item.transcoded` in group `packager-workers`
            # and produces nothing (terminal stage). Topic + group are
            # env-overridable; the defaults match the shared contract.
            - name: KAFKA_BROKERS
              value: "kafka.stube.svc.cluster.local:9092"
            - name: KAFKA_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: KAFKA_GROUP_ID
              value: "packager-workers"
            - name: CONSUME_TOPIC
              value: "stube.catalog.item.transcoded"
            # 5.1 companion rendition (group audio-surround) for >= 6-channel
            # tracks: eac3 | ac3 | off.
            - name: SURROUND_AUDIO
              value: "eac3"
            # Reference the WebVTT HLS renditions from the master. Leave off
            # until the playback routes serve hls/sN/ (README "Subtitles").
            - name: HLS_SUBTITLES
              value: "false"
            # DEFAULT=YES audio language order; empty = the language
            # whitelist setting's order.
            - name: PREFERRED_LANGUAGES
              value: ""
          volumeMounts:
            # Read-only source files. Same NFS export the analyzer reads.
            - name: media
              mountPath: /var/lib/katalog/media
              readOnly: true
            # Writeable packaged output tree. katalog-stream reads from
            # the same PVC (RO there) to serve the CMAF segments.
            - name: packages
              mountPath: /var/lib/katalog/packages
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Packaging is CPU-bound (ffmpeg remux + shaka-packager
              # walk). 4 vCPU keeps us under ~5 min per 2 h movie on
              # the current node mix. Memory headroom mostly absorbs
              # ffprobe's stream-table allocations on bigger files.
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: packages
          persistentVolumeClaim:
            claimName: packages
# NOTE: the stale-claim janitor CronJob from the chino reference
# (katalog-beta/katalog-janitor) is intentionally NOT recreated here.
# It stays in katalog-beta as an operational utility against the live
# postgres schema, owned by katalog-manager-api's deploy job — not
# duplicated per worker.
